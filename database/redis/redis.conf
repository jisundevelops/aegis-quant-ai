# ============================================================
# Aegis Quant AI — Redis configuration
# Run:
#   redis-server database/redis/redis.conf
# ============================================================

# Memory
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

# Network
bind 127.0.0.1
protected-mode yes
port 6379
tcp-keepalive 300
timeout 0

# Logging
loglevel notice
logfile ""

# Security
# requirepass your-redis-password-here
